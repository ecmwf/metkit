[workspace]
resolver = "2"
members = ["crates/metkit-sys", "crates/metkit"]

[workspace.package]
version = "1.22.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/ecmwf/metkit"
rust-version = "1.90"
readme = "README.md"
keywords = ["ecmwf", "weather", "meteorology", "grib"]
categories = ["science"]

[workspace.dependencies]
# Internal
metkit-sys = { version = "1.22", path = "crates/metkit-sys", default-features = false, features = ["metkit-config"] }
metkit = { version = "1.22", path = "crates/metkit" }

# Foundation crates
eckit-sys = { git = "ssh://git@github.com/ecmwf/eckit.git", branch = "develop", default-features = false }
eccodes-sys = { git = "ssh://git@github.com/ecmwf/rust-wrappers-playground.git", rev = "1c0e477", default-features = false }
# High-level wrappers
eckit = { git = "ssh://git@github.com/ecmwf/eckit.git", branch = "develop", default-features = false }

# Build tools
bindman = { git = "ssh://git@github.com/ecmwf/bindman.git", rev = "25726ab" }
bindman-build = { git = "ssh://git@github.com/ecmwf/bindman.git", rev = "25726ab" }
bindman-utils = { git = "ssh://git@github.com/ecmwf/bindman.git", rev = "25726ab" }

# External
cxx = "1.0"
cxx-build = "1.0"
thiserror = "2"
