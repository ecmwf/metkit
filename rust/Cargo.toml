[workspace]
resolver = "2"
members = ["crates/metkit-sys"]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/ecmwf/metkit"
rust-version = "1.90"
readme = "README.md"
keywords = ["ecmwf", "weather", "meteorology", "grib"]
categories = ["science"]

[workspace.dependencies]
# Internal
metkit-sys = { path = "crates/metkit-sys" }

# Foundation crates
eckit-sys = { git = "ssh://git@github.com/ecmwf/eckit.git", branch = "rust-bindings", default-features = false }
eccodes-sys = { git = "ssh://git@github.com/ecmwf/rust-wrappers-playground.git", default-features = false }

# Build tools
bindman = { git = "ssh://git@github.com/ecmwf/bindman.git" }
bindman-build = { git = "ssh://git@github.com/ecmwf/bindman.git" }
bindman-utils = { git = "ssh://git@github.com/ecmwf/bindman.git" }

# External
cxx = "1.0"
cxx-build = "1.0"
thiserror = "2"

# Redirect playground's eckit-sys (pulled in transitively by
# eccodes-sys from the playground) to the one from `ecmwf/eckit`, so the
# `links = "eckit_sys"` value appears only once in the graph.
[patch."ssh://git@github.com/ecmwf/rust-wrappers-playground.git"]
eckit-sys = { git = "ssh://git@github.com/ecmwf/eckit.git", branch = "rust-bindings" }
